[package]
name = "anthology"
version = "0.2.0"
edition = "2024"
description = "A document publishing platform - rustmax demo app"
license = "MIT OR Apache-2.0"
authors = ["Brian Anderson <andersrb@gmail.com>"]

# Anthology takes exactly one dependency, on purpose.
# Everything it needs is reached through `rustmax`,
# renamed to `rmx` the way the rustmax project template renames it,
# so that the whole app doubles as a test that the supercrate is
# self-sufficient for a real program.
[dependencies]
rmx.package = "rustmax"
rmx.path = "../crates/rustmax"
rmx.version = "0.0.10"
rmx.features = ["rmx-profile-max"]

# The workspace excludes this directory, so it is its own profile root and
# needs the setting the workspace root carries. Full DWARF for this app and
# its dependencies is the bulk of a target directory; `line-tables-only`
# keeps the file and line that a backtrace prints and drops the variable and
# type descriptions that only a debugger reads.
[profile.dev]
debug = "line-tables-only"
