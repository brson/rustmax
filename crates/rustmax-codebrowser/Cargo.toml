[package]
name = "rustmax-codebrowser"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Static cross-referenced source browser for cargo workspaces"
include = ["src/**/*", "assets/**/*", "templates/**/*", "Cargo.toml"]

[dependencies]
rmx.path = "../rustmax"
rmx.version = "0.0.11"
rmx.package = "rustmax"
rmx.default-features = false
rmx.features = [
  "rmx-profile-std",
  "rmx-feature-derive",
  "rmx-feature-serde",
]

rustmax-rustdoc.path = "../rustmax-rustdoc"
rustmax-rustdoc.version = "0.0.11"

serde.version = "1"
serde.features = ["derive"]

scip.version = "0.10"
protobuf.version = "3"

syntect.version = "5.3"
syntect.default-features = false
syntect.features = ["default-syntaxes", "default-themes", "html", "regex-onig"]
