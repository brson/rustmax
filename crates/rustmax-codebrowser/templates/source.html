{% extends "base.html" %}
{% block content %}
<div class="file-info">
    <span>{{ line_count }} lines</span>
    <span>{{ size }} bytes</span>
    <span>{{ syntax }}</span>
    {% if indexed %}<span class="indexed">cross-referenced</span>{% endif %}
</div>
{% if package %}{% include "package.html" %}{% endif %}
<pre class="code"><code>{{ code | safe }}</code></pre>
<script type="application/json" id="locals">{{ locals | safe }}</script>
{% endblock content %}
