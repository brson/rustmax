# Relevance corpus: does search return the right answer?
#
# This is not search-corpus.json. That one pins the two implementations to
# each other and was generated from the code, so it locks in whatever the
# ranking does today, mistakes included. This file is hand-written judgment
# about what a query *should* find, and the code is measured against it.
#
# Each case gives a query and the topic ids that would be a good top result.
# The search runs against the real topics in src/topics, not a fixture.
#
# status = "fails" records a case that does not work yet. Those are tracked
# rather than deleted: they are the to-do list, and the test fails if one
# starts passing so that the progress gets recorded here.

# --- Names people type directly. These are the regression guard. ---

[[case]]
query = "tokio"
expect = ["tokio"]

[[case]]
query = "regex"
expect = ["regex-crate"]

[[case]]
query = "clap"
expect = ["clap"]

[[case]]
query = "tempfile"
expect = ["tempfile"]

[[case]]
query = "rayon"
expect = ["rayon"]

[[case]]
query = "serde"
expect = ["serde"]

[[case]]
query = "unwrap"
expect = ["std-option", "std-result"]

[[case]]
query = "iterator"
expect = ["std-iter"]

[[case]]
query = "mutex"
expect = ["std-sync"]

[[case]]
query = "atomic"
expect = ["std-sync-atomic"]

[[case]]
query = "backtrace"
expect = ["std-backtrace"]

[[case]]
query = "markdown"
expect = ["comrak"]

[[case]]
query = "readline"
expect = ["rustyline"]

[[case]]
query = "the book"
expect = ["trpl"]

# A word that is a prefix of an unrelated std alias ("UnsafeCell"), which
# outranks the book on category weight.
[[case]]
query = "unsafe"
expect = ["nomicon"]
status = "fails"

