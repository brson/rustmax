[package]
name = "rustmax-prebuild"
publish = false
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "rustmax-prebuild"
path = "src/main.rs"

[dependencies]
anyhow.version = "1"
chrono.version = "0.4.39"
clap.version = "4.5.23"
json5.version = "1.3.0"
regex.version = "1.11.1"
serde.version = "1"
serde.features = ["derive"]
serde_json.version = "1"
tera.version = "2.1.1"
tera.features = ["glob_fs"]
toml.version = "1.1.4"
comrak.version = "0.54.0"
comrak.default-features = false
syntect.version = "5.3"
syntect.default-features = false
syntect.features = ["default-syntaxes", "default-themes", "html", "regex-onig"]
