[package]
name = "rustmax-macros"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Procedural macros for the `rustmax` crate."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1.0.92", default-features = false, features = ["proc-macro"] }
proc-macro-crate = { version = "3.5.0", default-features = false }
quote = { version = "1.0.37", default-features = false, features = ["proc-macro"] }
