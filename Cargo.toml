[workspace.package]
description = "A collection of useful crates."
edition = "2024"
version = "0.0.10"
license = "Apache-2.0 OR Apache-2.0 WITH LLVM-exception OR MIT OR CC0-1.0"
authors = ["Brian Anderson <andersrb@gmail.com>"]
repository = "https://github.com/brson/rustmax"

[workspace]
resolver = "2"

members = [
  "crates/*",
]

default-members = [
  "crates/rustmax",
  "crates/rustmax-cli",
]

exclude = [
  "demoapp",
  "work/books/",
  "suite",
]

# Full DWARF for this workspace and its dependencies is the bulk of a target
# directory. `line-tables-only` keeps the file and line that a backtrace
# prints and drops the variable and type descriptions that only a debugger
# reads. Release is left at the default of no debuginfo at all.
[profile.dev]
debug = "line-tables-only"

[profile.release]
overflow-checks = true
